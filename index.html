<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NovaMeet</title>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<style>
body{
margin:0;
background:radial-gradient(circle at top,#0f172a,#0b1120);
color:white;
font-family:system-ui;
overflow:hidden;
}

/* ROOM LABEL */
#room{
position:fixed;
top:14px;
left:14px;
padding:10px 14px;
border-radius:14px;
background:rgba(15,23,42,.6);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.08);
font-size:13px;
z-index:10;
}

/* LAYOUT */
#videos{
display:flex;
height:100vh;
padding:20px;
gap:20px;
}

/* YOU */
#localBox{
flex:1.3;
}

/* OTHERS */
#remoteBox{
flex:1;
display:flex;
flex-direction:column;
gap:12px;
overflow:auto;
}

/* VIDEO CARD */
.videoCard{
position:relative;
width:100%;
height:100%;
border-radius:22px;
overflow:hidden;
background:#111827;
border:1px solid rgba(255,255,255,.06);
box-shadow:0 20px 60px rgba(0,0,0,.5);
}

#remoteBox .videoCard{
height:50%;
min-height:220px;
}

video{
width:100%;
height:100%;
object-fit:cover;
}

.label{
position:absolute;
bottom:12px;
left:12px;
padding:6px 10px;
border-radius:10px;
background:rgba(0,0,0,.4);
backdrop-filter:blur(10px);
font-size:13px;
}

/* CONTROLS */
#controls{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:12px;
padding:14px 18px;
border-radius:22px;
background:rgba(15,23,42,.65);
backdrop-filter:blur(25px);
border:1px solid rgba(255,255,255,.08);
box-shadow:0 20px 50px rgba(0,0,0,.5);
}

.ctrl{
width:56px;
height:56px;
border-radius:16px;
border:none;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
transition:.2s;
background:#1e293b;
}

.ctrl svg{
width:22px;
height:22px;
fill:#e2e8f0;
}

.ctrl:hover{
transform:translateY(-3px);
}

.on{
background:#16a34a;
}

.off{
background:#dc2626;
}

</style>
</head>

<body>

<div id="room">Room: global-room</div>

<div id="videos">

<div id="localBox"></div>
<div id="remoteBox"></div>

</div>

<div id="controls">

<button id="micBtn" class="ctrl on">
<svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3z"/></svg>
</button>

<button id="camBtn" class="ctrl on">
<svg viewBox="0 0 24 24"><path d="M17 10.5V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3.5l4 4v-11l-4 4z"/></svg>
</button>

<button id="screenBtn" class="ctrl on">
<svg viewBox="0 0 24 24"><path d="M3 4h18v12H3z"/></svg>
</button>

<button id="leaveBtn" class="ctrl off">
<svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5v10z"/></svg>
</button>

</div>

<script>
const socket=io("http://localhost:3000");

let localStream;
let screenStream;
let peers={};

let mic=true;
let cam=true;
let screen=false;

/* START */
async function start(){

localStream=await navigator.mediaDevices.getUserMedia({
video:true,
audio:true
});

addLocal(localStream);

socket.emit("join-room","main");

socket.on("user-joined",async id=>{
const pc=createPeer(id);

localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));

const offer=await pc.createOffer();
await pc.setLocalDescription(offer);

socket.emit("offer",{to:id,offer});
});

socket.on("offer",async ({from,offer})=>{
const pc=createPeer(from);

await pc.setRemoteDescription(offer);

localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));

const ans=await pc.createAnswer();
await pc.setLocalDescription(ans);

socket.emit("answer",{to:from,answer:ans});
});

socket.on("answer",({from,answer})=>{
peers[from].setRemoteDescription(answer);
});

socket.on("ice",({from,candidate})=>{
peers[from]?.addIceCandidate(candidate);
});
}

/* PEER */
function createPeer(id){

const pc=new RTCPeerConnection({
iceServers:[{urls:"stun:stun.l.google.com:19302"}]
});

peers[id]=pc;

pc.onicecandidate=e=>{
if(e.candidate){
socket.emit("ice",{to:id,candidate:e.candidate});
}
};

pc.ontrack=e=>{
addRemote(id,e.streams[0]);
};

return pc;
}

/* UI */
function addLocal(stream){
const card=document.createElement("div");
card.className="videoCard";

const video=document.createElement("video");
video.autoplay=true;
video.muted=true;
video.srcObject=stream;

const label=document.createElement("div");
label.className="label";
label.innerText="You";

card.appendChild(video);
card.appendChild(label);

localBox.appendChild(card);
}

function addRemote(id,stream){

let old=document.getElementById(id);
if(old) old.remove();

const card=document.createElement("div");
card.className="videoCard";
card.id=id;

const video=document.createElement("video");
video.autoplay=true;
video.srcObject=stream;

const label=document.createElement("div");
label.className="label";
label.innerText="User";

card.appendChild(video);
card.appendChild(label);

remoteBox.appendChild(card);
}

/* CONTROLS */
micBtn.onclick=()=>{
mic=!mic;
localStream.getAudioTracks()[0].enabled=mic;
micBtn.classList.toggle("on",mic);
micBtn.classList.toggle("off",!mic);
};

camBtn.onclick=()=>{
cam=!cam;
localStream.getVideoTracks()[0].enabled=cam;
camBtn.classList.toggle("on",cam);
camBtn.classList.toggle("off",!cam);
};

screenBtn.onclick=async()=>{

if(!screen){
screenStream=await navigator.mediaDevices.getDisplayMedia({video:true});
const track=screenStream.getVideoTracks()[0];

for(let id in peers){
let sender=peers[id].getSenders().find(s=>s.track.kind==="video");
sender.replaceTrack(track);
}

screen=true;
}else{

const cam=await navigator.mediaDevices.getUserMedia({video:true});
const track=cam.getVideoTracks()[0];

for(let id in peers){
let sender=peers[id].getSenders().find(s=>s.track.kind==="video");
sender.replaceTrack(track);
}

screen=false;
}
};

leaveBtn.onclick=()=>{
Object.values(peers).forEach(p=>p.close());
location.reload();
};

start();
</script>

</body>
</html>
